services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: digitalocean.com/php
    container_name: app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      POLICE_SCORECARD_API_BASE: ${DOCKER_API_BASE:-${POLICE_SCORECARD_API_BASE:-http://host.docker.internal:5001}}
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./.docker/php/zz-local-pool.conf:/usr/local/etc/php-fpm.d/zz-local-pool.conf
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./.docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      - ./.docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
    networks:
      - app-network
  webserver:
    image: nginx:alpine
    container_name: webserver
    restart: unless-stopped
    tty: true
    expose:
      - "9000"
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
